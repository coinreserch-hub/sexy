name: plan bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: plan-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy
      - name: run plan bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNT_USDT: ${{ secrets.ACCOUNT_USDT }}
        run: python plan_bot.py
      - name: persist state
        run: |
          git config user.name "plan-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plan_state.json || true
          git commit -m "plan state" || echo "no change"
          git push || echo "push skipped"
